<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- This machine has no system fonts and no /etc/fonts, so Chromium's own UI text
     (popups, tooltips, form-control menus) has nothing to draw with and the whole
     browser process exits. Point it at the DejaVu fonts in the nix store. -->
<fontconfig>
  <dir>/nix/store/mpp3ks5dkanb5q0pll7mz98rng1sifcm-dejavu-fonts-minimal-2.37/share/fonts</dir>
  <cachedir>/home/tschallacka/crew/.fontcache</cachedir>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
